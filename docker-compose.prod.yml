name: nexus-social-platform

services:
  backend:
    image: ghcr.io/vishnusureshas/social-media-management/backend:${TAG:-latest}
    container_name: nexus-backend
    restart: unless-stopped
    ports:
      - "5002:5000"
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: 5000
      REDIS_URL: redis://redis:6379
      REDIS_ENABLED: "true"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:5000/api/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - nexus-net

  redis:
    image: redis:7-alpine
    container_name: nexus-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - nexus-net

  frontend:
    image: ghcr.io/vishnusureshas/social-media-management/frontend:${TAG:-latest}
    container_name: nexus-frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - backend
    networks:
      - nexus-net

volumes:
  redis-data:

networks:
  nexus-net:
    driver: bridge
